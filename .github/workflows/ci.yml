# CI (tasks.md 13.6): lint → typecheck → unit → integration → build → e2e
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: salary
          POSTGRES_PASSWORD: salary
          POSTGRES_DB: salary
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U salary" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://salary:salary@localhost:5432/salary
      TEST_DATABASE_URL: postgresql://salary:salary@localhost:5432/salary_test
      BETTER_AUTH_SECRET: ci-only-secret-not-used-in-production-000000
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare databases
        run: |
          PGPASSWORD=salary psql -h localhost -U salary -d salary -c "CREATE DATABASE salary_test"
          pnpm exec prisma migrate deploy
          pnpm db:test:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm db:seed
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E
        run: pnpm exec playwright test --trace off
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
